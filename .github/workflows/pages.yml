name: Publish GitHub Pages

# Static files only (app/, files/, index.json, latest*.json, README.md, and
# the rest of the tree). No Jekyll: the committed files are copied into _site
# and uploaded as the Pages artifact.
#
# "Rebuild file index" commits index.json and pushes it with the default
# GITHUB_TOKEN. A GITHUB_TOKEN push does not start other workflows, so this
# also runs after that workflow completes successfully. For workflow_run,
# GITHUB_SHA is the last commit on the default branch, which already includes
# that index.json commit. workflow_run.head_sha is the earlier commit that
# started the index rebuild, so checkout must not pin that SHA.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Rebuild file index
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# configure-pages runs in build, so pages: write is granted here and not only
# on deploy. id-token: write is what deploy-pages uses to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A later run waits; it does not cancel a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage the site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, maoz-main00]
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage site files
        # This runner resolves `bash` to WindowsApps\bash.exe (WSL). The runner
        # template passes the temp script path unquoted, so the backslashes are
        # stripped (`C:UsersMaozactions-runner...sh`) and the script never starts.
        # powershell's -Command single-quotes that path. Bypass covers a
        # Restricted execution policy on a self-hosted Windows machine.
        # Full path: Which("powershell") can hit the same WindowsApps stub.
        shell: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command \". '{0}'\""
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $utf8Out = New-Object System.Text.UTF8Encoding $false
            [Console]::OutputEncoding = $utf8Out
            $OutputEncoding = $utf8Out
          } catch {
            # Log encoding only. Copying files does not depend on it.
          }

          $root = (Get-Location).ProviderPath
          $site = Join-Path $root '_site'
          if ([System.IO.Directory]::Exists($site)) {
            [System.IO.Directory]::Delete($site, $true)
          } elseif ([System.IO.File]::Exists($site)) {
            [System.IO.File]::Delete($site)
          }
          [void][System.IO.Directory]::CreateDirectory($site)

          $gitCmd = 'C:\Program Files\Git\cmd\git.exe'
          if (-not (Test-Path -LiteralPath $gitCmd)) {
            $found = Get-Command git -ErrorAction SilentlyContinue
            if ($found -and $found.Source) {
              $gitCmd = $found.Source
            } else {
              [Console]::Error.WriteLine('git was not found')
              exit 1
            }
          }

          # Raw UTF-8 from git. Piping `git ls-files` through PowerShell would
          # decode Hebrew names under files/ with the console code page.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $gitCmd
          $psi.Arguments = '-c core.quotepath=false ls-files -z'
          $psi.WorkingDirectory = $root
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $psi.StandardOutputEncoding = $utf8
          $psi.StandardErrorEncoding = $utf8
          $proc = New-Object System.Diagnostics.Process
          try {
            $proc.StartInfo = $psi
            [void]$proc.Start()
            $stderrTask = $proc.StandardError.ReadToEndAsync()
            $stdout = $proc.StandardOutput.ReadToEnd()
            $stderr = $stderrTask.Result
            [void]$proc.WaitForExit()
            $code = $proc.ExitCode
          } finally {
            $proc.Dispose()
          }
          if ($code -ne 0) {
            [Console]::Error.WriteLine("git ls-files exited ${code}: $stderr")
            exit $code
          }

          $tracked = @($stdout -split "`0" | Where-Object { -not [string]::IsNullOrEmpty($_) })
          if ($tracked.Count -eq 0) {
            [Console]::Error.WriteLine('git ls-files returned no paths')
            exit 1
          }

          function Test-ExcludedPath([string]$RepoRelative) {
            $normalized = $RepoRelative -replace '\\', '/'
            return $normalized.StartsWith('.github/', [System.StringComparison]::Ordinal) -or
              $normalized.StartsWith('tools/', [System.StringComparison]::Ordinal)
          }

          function Get-RepoFullPath([string]$Base, [string]$RepoRelative) {
            $full = $Base
            foreach ($part in ($RepoRelative -split '[\\/]+')) {
              if ([string]::IsNullOrEmpty($part) -or $part -eq '.') { continue }
              $full = Join-Path $full $part
            }
            return $full
          }

          foreach ($path in $tracked) {
            if (Test-ExcludedPath $path) { continue }
            $source = Get-RepoFullPath $root $path
            $dest = Get-RepoFullPath $site $path
            $parent = Split-Path -Parent $dest
            if ([string]::IsNullOrEmpty($parent)) {
              [Console]::Error.WriteLine("not staged: $path")
              exit 1
            }
            [void][System.IO.Directory]::CreateDirectory($parent)
            [System.IO.File]::Copy($source, $dest, $true)
          }

          foreach ($name in @('.git', '.github', 'tools')) {
            $candidate = Join-Path $site $name
            if ([System.IO.Directory]::Exists($candidate) -or [System.IO.File]::Exists($candidate)) {
              [Console]::Error.WriteLine('excluded path was staged into _site')
              exit 1
            }
          }

          Write-Output 'Staged site:'
          $missing = $false
          foreach ($path in $tracked) {
            if (Test-ExcludedPath $path) { continue }
            $dest = Get-RepoFullPath $site $path
            if (-not [System.IO.File]::Exists($dest)) {
              [Console]::Error.WriteLine("not staged: $path")
              $missing = $true
              continue
            }
            Write-Output ('_site/' + ($path -replace '\\', '/'))
          }
          if ($missing) {
            exit 1
          }
          exit 0

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: [self-hosted, maoz-main00]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
